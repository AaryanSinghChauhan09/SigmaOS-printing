[package]
name = "sigmaos-printing"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Printing system and printer management"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-printing"
readme = "README.md"
keywords = ["print", "printer", "cups"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
